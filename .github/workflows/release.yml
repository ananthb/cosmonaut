name: Release

on:
  push:
    tags:
      - "v*"

# Goreleaser drives the binary builds, archives, DMG, and the .app
# bundle. nix-appimage stays as the AppImage source — it's hermetic
# (squashfs + user namespaces) and there's no off-the-shelf
# replacement that runs on any Linux box. The publish job aggregates
# all artifacts, computes SHA256SUMS, cosign-signs the checksum file,
# and uploads the GitHub release.
#
# Every third-party action is pinned to a full commit SHA: this job
# holds id-token: write for keyless signing, so a mutable tag (or
# branch) reference would let a compromised action tamper with
# artifacts *before* they're checksummed and signed.

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install GTK / X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libappindicator3-dev libgl1-mesa-dev pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libxext-dev libxfixes-dev

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.linux.yaml

      # Build the AppImage AFTER goreleaser: `release --clean` wipes the
      # dist dir (build/), so anything staged there beforehand is deleted.
      # A previous ordering did exactly that — the AppImage vanished and
      # the release shipped without it, silently, because the upload
      # step's other glob still matched.
      - name: Build hermetic AppImage via nix-appimage
        run: |
          nix build .#packages.x86_64-linux.appimage -o result-appimage
          cp -L result-appimage build/cosmonaut-amd64.AppImage
          chmod +w build/cosmonaut-amd64.AppImage

      - name: Assert all Linux artifacts exist
        run: |
          test -s build/cosmonaut-amd64.tar.gz
          test -s build/cosmonaut-amd64.AppImage

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: |
            build/cosmonaut-amd64.tar.gz
            build/cosmonaut-amd64.AppImage
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --config .goreleaser.darwin.yaml

      - name: Assert all macOS artifacts exist
        run: |
          test -s build/cosmonaut-macos-arm64.dmg
          test -s build/cosmonaut-macos-arm64.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: |
            build/cosmonaut-macos-arm64.dmg
            build/cosmonaut-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.10.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums and sign
        working-directory: artifacts
        # Sign only SHA256SUMS — users verify the checksum file's
        # cosign signature, then trust the listed hashes for each
        # artifact. Avoids the .sig/.pem pair-per-file fanout.
        #
        # Assert the exact artifact set first: a job that silently
        # dropped an artifact must fail here, not ship a partial
        # release. Remove any stale checksum/signature files from a
        # previous partial run so they can't end up inside the new
        # SHA256SUMS, then write via a tempfile so the `*` glob can't
        # self-reference the freshly-truncated file.
        run: |
          for f in cosmonaut-amd64.tar.gz cosmonaut-amd64.AppImage \
                   cosmonaut-macos-arm64.dmg cosmonaut-macos-arm64.tar.gz; do
            test -s "$f" || { echo "missing release artifact: $f" >&2; exit 1; }
          done
          rm -f SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: artifacts/*
