name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR-triggered jobs run repo-controlled scripts (nix run .#build), so the
# default token must stay read-only. Actions are SHA-pinned to match the
# release workflow's supply-chain posture.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      - name: Build (lint + test)
        run: nix run .#build

      - name: Compile binary
        run: nix build

  goreleaser-check:
    name: goreleaser check + snapshot smoke test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            config: .goreleaser.linux.yaml
          - os: macos-latest
            config: .goreleaser.darwin.yaml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libappindicator3-dev libgl1-mesa-dev pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libxext-dev libxfixes-dev

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check --config ${{ matrix.config }}

      - name: Snapshot build (smoke test)
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --single-target --clean --config ${{ matrix.config }}

  test-macos:
    # Darwin-specific code paths (hotkey modifiers, caffeinate inhibitor,
    # launchd integration) are a first-class release target; run the test
    # suite on macOS, not just the goreleaser snapshot compile.
    name: test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go vet + test
        run: |
          go vet ./...
          go test ./...
