name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions are scoped per job: only deploy needs pages/id-token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # gomarkdoc type-checks the packages it documents; internal/daemon
      # and internal/tui pull in Fyne, whose cgo bindings need the same
      # GTK/X11 headers the CI build installs.
      - name: Install GTK / X11 build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libappindicator3-dev libgl1-mesa-dev pkg-config \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev \
            libxxf86vm-dev libxext-dev libxfixes-dev

      - name: Install gomarkdoc
        run: go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v1.1.0

      - name: Generate API docs from godoc
        run: |
          gomarkdoc --output docs/api/codespace.md ./internal/codespace/
          gomarkdoc --output docs/api/config.md ./internal/config/
          gomarkdoc --output docs/api/daemon.md ./internal/daemon/
          gomarkdoc --output docs/api/editor.md ./internal/editor/
          gomarkdoc --output docs/api/history.md ./internal/history/
          gomarkdoc --output docs/api/slug.md ./internal/slug/
          gomarkdoc --output docs/api/sshconfig.md ./internal/sshconfig/
          gomarkdoc --output docs/api/tui.md ./internal/tui/

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Build docs
        run: |
          pip install 'mkdocs-material~=9.6'
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
